name: Spatial Geometry Proof Engine

on:
  schedule:
    - cron: '21 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: spatial-geometry-compile
  cancel-in-progress: true

jobs:
  prove-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore DuckDB Database Cache
        uses: actions/cache@v4
        with:
          path: data/spatial_geometry.db
          key: spatial-geom-v1-db-${{ github.run_id }}
          restore-keys: |
            spatial-geom-v1-db-

      - name: Execute Spatial Geometry Proof Engine
        run: python spatial_proof_engine.py

      - name: Commit Historical Ledger and Spatial Proofs
        run: |
          git config user.name "spatial-geom-bot[bot]"
          git config user.email "spatial-geom-bot@users.noreply.github.com"

          # Stage ledger, parquet, and public updates
          git add ledger/ data/ public/

          if git diff --staged --quiet; then
            echo "No spatial proof updates to commit."
          else
            git commit -m "chore(spatial): compute deterministic geometry containment proofs [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifacts to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
